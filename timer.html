<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Timekeeper</title>
  <link rel="stylesheet" href="timer.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" class="stop-accent-a"/><stop offset="1" class="stop-accent-b"/>
      </linearGradient>
      <linearGradient id="g-warn" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" class="stop-warn-a"/><stop offset="1" class="stop-warn-b"/>
      </linearGradient>
      <linearGradient id="g-over" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" class="stop-over-a"/><stop offset="1" class="stop-over-b"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M12 6.5V4M9.5 3.5h5"/></svg>
      </span>
      <div>
        <h1>Daily Timekeeper</h1>
        <p class="brand-sub">by Learn Time</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-sidepanel" class="icon-btn" title="Open in side panel" aria-label="Open in side panel" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
      </button>
      <button id="btn-popout" class="icon-btn" title="Pop out into its own window" aria-label="Pop out into its own window" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><line x1="20" y1="4" x2="11" y2="13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ SETUP ============ -->
  <section id="view-setup" class="view" hidden>
    <div class="card hero">
      <label for="set-team" class="eyebrow">People in today's daily</label>
      <div class="stepper">
        <button type="button" id="team-minus" class="round-btn" aria-label="One person fewer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
        </button>
        <input type="number" id="set-team" min="1" max="50" step="1" inputmode="numeric">
        <button type="button" id="team-plus" class="round-btn" aria-label="One person more">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="tiles">
      <label class="tile">
        <span class="eyebrow">Per person</span>
        <span class="tile-value"><input type="number" id="set-speaker" min="0.25" max="30" step="0.25"><span class="unit">min</span></span>
      </label>
      <label class="tile">
        <span class="eyebrow">Timebox</span>
        <span class="tile-value"><input type="number" id="set-meeting" min="1" max="120" step="1"><span class="unit">min</span></span>
      </label>
    </div>

    <div class="fit" id="fit">
      <div class="fit-track"><div class="fit-fill" id="fit-fill"></div></div>
      <div class="fit-text"><span id="setup-summary"></span><span id="fit-note" class="pill"></span></div>
    </div>

    <details class="card settings" id="settings">
      <summary>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Alerts &amp; behaviour
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </summary>
      <div class="settings-body">
        <label class="row">Warn before time is up <span class="mini-input"><input type="number" id="set-warn" min="0" max="300" step="5"> sec</span></label>
        <label class="row">Sound alerts <input type="checkbox" class="switch" id="set-sound"></label>
        <label class="row">Desktop notifications <input type="checkbox" class="switch" id="set-notify"></label>
        <label class="row">Auto-advance when time is up <input type="checkbox" class="switch" id="set-auto"></label>
      </div>
    </details>

    <button id="btn-start" class="primary cta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      Start daily
    </button>
  </section>

  <!-- ============ MEETING ============ -->
  <section id="view-meeting" class="view" hidden>
    <div class="meeting-bar">
      <div class="meeting-meta">
        <span class="elapsed"><strong id="meeting-elapsed">0:00</strong><span class="muted"> / <span id="meeting-box">15:00</span></span></span>
        <span id="meeting-forecast" class="pill"></span>
      </div>
      <div class="progress"><div id="meeting-progress"></div></div>
    </div>

    <div class="stage">
      <div class="ring-wrap" id="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle id="ring-fg" class="ring-fg" cx="60" cy="60" r="52"/>
        </svg>
        <div class="ring-center" aria-live="polite">
          <div id="speaker-name" class="speaker-chip"></div>
          <div id="speaker-time" class="speaker-time"></div>
          <div id="speaker-pos" class="speaker-pos"></div>
        </div>
      </div>
    </div>

    <div class="dock" role="group" aria-label="Speaker controls">
      <button id="btn-prev" class="dock-btn" title="Previous speaker (←)" aria-label="Previous speaker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        <span>Back</span>
      </button>
      <button id="btn-later" class="dock-btn" title="Not ready: move to end of queue (L)" aria-label="Move speaker to later">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><polyline points="20 4 20 9 15 9"/><polyline points="12 8 12 12 14.5 13.5"/></svg>
        <span>Later</span>
      </button>
      <button id="btn-pause" class="play" title="Pause / resume (Space)" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5.5" width="3.2" height="13" rx="1.2"/><rect x="13.8" y="5.5" width="3.2" height="13" rx="1.2"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a1 1 0 0 0 1.5.86l10-6.2a1 1 0 0 0 0-1.72l-10-6.2a1 1 0 0 0-1.5.86z"/></svg>
      </button>
      <button id="btn-next" class="next-btn" title="Next speaker (→)">
        <span class="next-text">
          <span id="next-label" class="next-label">Next</span>
          <span id="next-sub" class="next-sub"></span>
        </span>
        <span class="next-icon" aria-hidden="true">
          <svg class="i-arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
          <svg class="i-check" viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>
        </span>
      </button>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Speakers</h2>
        <button id="btn-add-speaker" class="link-btn" title="Someone joined late">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
          Add
        </button>
      </div>
      <ol id="queue" class="queue"></ol>
    </div>

    <div class="card">
      <div class="card-head"><h2><label for="notes">Parking lot</label></h2></div>
      <textarea id="notes" rows="2" placeholder="Topics to take offline after the daily…"></textarea>
    </div>

    <div class="meeting-footer">
      <span class="keys"><kbd>Space</kbd> pause <kbd>←</kbd><kbd>→</kbd> move <kbd>L</kbd> later</span>
      <button id="btn-end" class="ghost-danger">End daily</button>
    </div>
  </section>

  <!-- ============ SUMMARY ============ -->
  <section id="view-summary" class="view" hidden>
    <div class="card hero summary-hero">
      <span class="eyebrow">Daily finished</span>
      <div class="summary-total" id="sum-total"></div>
      <span class="pill" id="sum-verdict"></span>
      <div class="stats" id="sum-stats"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Time per speaker</h2></div>
      <ul id="sum-list" class="sum-list"></ul>
    </div>

    <div class="card" id="sum-notes-wrap" hidden>
      <div class="card-head"><h2>Parking lot</h2></div>
      <pre id="sum-notes" class="sum-notes"></pre>
    </div>

    <div class="actions">
      <button id="btn-copy" class="secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
        <span>Copy summary</span>
      </button>
      <button id="btn-new" class="primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
        New daily
      </button>
    </div>
  </section>

  <script type="module" src="timer.js"></script>
</body>
</html>
