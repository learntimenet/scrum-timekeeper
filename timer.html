<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Timekeeper</title>
  <link rel="stylesheet" href="timer.css">
</head>
<body>
  <header class="topbar">
    <h1>Daily Timekeeper</h1>
    <div class="topbar-actions">
      <button id="btn-sidepanel" class="icon-btn" title="Open in side panel" aria-label="Open in side panel" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
      </button>
      <button id="btn-popout" class="icon-btn" title="Pop out into its own window" aria-label="Pop out into its own window" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><line x1="20" y1="4" x2="11" y2="13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ SETUP ============ -->
  <section id="view-setup" hidden>
    <div class="team-size">
      <label for="set-team" class="team-size-label">People in today's daily</label>
      <div class="stepper">
        <button type="button" id="team-minus" aria-label="One person fewer">−</button>
        <input type="number" id="set-team" min="1" max="50" step="1" inputmode="numeric">
        <button type="button" id="team-plus" aria-label="One person more">+</button>
      </div>
    </div>

    <div class="quick-settings">
      <label>Time per person <span><input type="number" id="set-speaker" min="0.25" max="30" step="0.25"> min</span></label>
      <label>Meeting timebox <span><input type="number" id="set-meeting" min="1" max="120" step="1"> min</span></label>
    </div>

    <details class="settings" id="settings">
      <summary>More settings</summary>
      <label>Warn before time is up <span><input type="number" id="set-warn" min="0" max="300" step="5"> sec</span></label>
      <label class="check"><input type="checkbox" id="set-sound"> Sound alerts</label>
      <label class="check"><input type="checkbox" id="set-notify"> Desktop notifications</label>
      <label class="check"><input type="checkbox" id="set-auto"> Auto-advance when time is up</label>
    </details>

    <div class="setup-footer">
      <span id="setup-summary" class="hint"></span>
      <button id="btn-start" class="primary">Start daily</button>
    </div>
  </section>

  <!-- ============ MEETING ============ -->
  <section id="view-meeting" hidden>
    <div class="meeting-bar">
      <div class="meeting-meta">
        <span><strong id="meeting-elapsed">0:00</strong> / <span id="meeting-box">15:00</span></span>
        <span id="meeting-forecast"></span>
      </div>
      <div class="progress"><div id="meeting-progress"></div></div>
    </div>

    <div class="ring-wrap" id="ring-wrap">
      <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="52"/>
        <circle id="ring-fg" class="ring-fg" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ring-center" aria-live="polite">
        <div id="speaker-name" class="speaker-name"></div>
        <div id="speaker-time" class="speaker-time"></div>
        <div id="speaker-pos" class="hint"></div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-prev" title="Previous speaker (←)" aria-label="Previous speaker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <button id="btn-pause" title="Pause / resume (Space)">Pause</button>
      <button id="btn-later" title="Not ready — move to end of queue (L)">Later</button>
      <button id="btn-next" class="primary" title="Next speaker (→)">Next</button>
    </div>

    <div class="queue-head">
      <h2>Queue</h2>
      <button id="btn-add-speaker" class="link-btn" title="Someone joined late">+ Add speaker</button>
    </div>
    <ol id="queue" class="queue"></ol>

    <label class="notes-label" for="notes">Parking lot</label>
    <textarea id="notes" rows="3" placeholder="Topics to take offline after the daily…"></textarea>

    <div class="meeting-footer">
      <span class="hint">Space pause · ← → move · L later</span>
      <button id="btn-end" class="danger">End daily</button>
    </div>
  </section>

  <!-- ============ SUMMARY ============ -->
  <section id="view-summary" hidden>
    <div class="summary-head">
      <div class="summary-total" id="sum-total"></div>
      <div class="hint" id="sum-verdict"></div>
    </div>
    <ul id="sum-list" class="sum-list"></ul>
    <div id="sum-notes-wrap" hidden>
      <h2>Parking lot</h2>
      <pre id="sum-notes" class="sum-notes"></pre>
    </div>
    <div class="setup-footer">
      <button id="btn-copy">Copy summary</button>
      <button id="btn-new" class="primary">New daily</button>
    </div>
  </section>

  <script type="module" src="timer.js"></script>
</body>
</html>
